# Keep-warm: ping periódico al backend en Modal (plan free).
# Modal duerme el servicio tras ~60 s sin tráfico; este cron genera
# actividad cada 10 min para que la demo pública responda al instante.
# En repos públicos, GitHub Actions es gratuito.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Modal backend
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://fernandoamadini--urbanvision-api-web.modal.run/api/health)
            if [ "$code" = "200" ]; then
              echo "Backend despierto (HTTP $code)"
              exit 0
            fi
            echo "Intento $i: HTTP $code - reintentando en 15s..."
            sleep 15
          done
          echo "El backend no respondio tras 3 intentos (se despertara con el proximo ping o click)."
